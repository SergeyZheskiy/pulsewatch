[project]
name = "pulsewatch"
version = "1.0.0"
description = "Self-hosted uptime monitoring with a public status page, alerts and uptime badges."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulsewatch*"]

[tool.setuptools.package-data]
pulsewatch = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]  # newest Starlette only

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["E501", "B008", "ASYNC109"]  # timeout is passed through to httpx, which handles it

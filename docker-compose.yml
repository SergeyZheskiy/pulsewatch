services:
  pulsewatch:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PULSEWATCH_DATABASE_URL: postgresql+asyncpg://pulsewatch:pulsewatch@db:5432/pulsewatch
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch
      POSTGRES_DB: pulsewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:

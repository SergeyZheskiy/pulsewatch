name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pulsewatch .
      - name: Smoke test the image
        run: |
          docker run -d --name pw -p 8000:8000 -e PULSEWATCH_API_KEY=ci pulsewatch
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs pw; exit 1
